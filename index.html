<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0284c7">
  <meta name="description" content="Mi Billetera Lite - Control de gastos diario y ultraligero que funciona 100% offline.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mi Billetera">
  
  <title>Mi Billetera Lite</title>

  <!-- Favicon y Manifest PWA -->
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">

  <!-- Hojas de Estilo -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <main class="app-container">
    <!-- Cabecera -->
    <header class="app-header">
      <div class="brand-wrapper">
        <img src="icons/favicon.svg" alt="Logo de Mi Billetera Lite" class="brand-icon">
        <div>
          <h1 class="brand-title">Mi Billetera Lite</h1>
        </div>
      </div>
    </header>

    <!-- Banner de Instalación PWA -->
    <section id="install-banner" class="install-banner" aria-label="Instalación de la aplicación">
      <div class="install-info">
        <strong class="install-title">Instalar aplicación</strong>
        <span class="install-sub">Accede más rápido desde tu pantalla de inicio</span>
      </div>
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <button id="btn-install" class="btn-install" type="button">Instalar</button>
        <button id="btn-dismiss-install" class="btn-dismiss" type="button" aria-label="Cerrar aviso">&times;</button>
      </div>
    </section>

    <!-- Totalizador de Gastos -->
    <section class="total-card" aria-label="Total acumulado">
      <div class="total-header">
        <span>Gasto Total Acumulado</span>
        <span id="total-badge">MXN</span>
      </div>
      <div id="total-amount" class="total-amount">$0.00</div>
      <div class="total-meta" id="total-count">0 gastos registrados</div>
    </section>

    <!-- Formulario de Registro de Gastos -->
    <section class="form-card" aria-labelledby="form-heading">
      <h2 id="form-heading" class="form-title">
        Registrar Nuevo Gasto
      </h2>
      <form id="expense-form" class="expense-form" novalidate>
        <div class="form-group">
          <label for="concept" class="form-label">Concepto del gasto</label>
          <input 
            type="text" 
            id="concept" 
            name="concept" 
            class="form-input" 
            placeholder="Ej: Café, Pasaje, Despensa" 
            required 
            autocomplete="off"
            maxlength="60"
          >
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="amount" class="form-label">Monto ($)</label>
            <input 
              type="number" 
              id="amount" 
              name="amount" 
              class="form-input" 
              placeholder="0.00" 
              step="0.01" 
              min="0.01" 
              required
            >
          </div>

          <div class="form-group">
            <label for="category" class="form-label">Categoría</label>
            <select id="category" name="category" class="form-select" required>
              <option value="Comida" selected>Comida</option>
              <option value="Transporte">Transporte</option>
              <option value="Servicios">Servicios</option>
              <option value="Ocio">Ocio</option>
              <option value="Otros">Otros</option>
            </select>
          </div>
        </div>

        <button type="submit" id="btn-submit" class="btn-primary">
          <span>Guardar Gasto</span>
        </button>
      </form>
    </section>

    <!-- Historial de Gastos -->
    <section class="history-section" aria-labelledby="history-heading">
      <div class="history-header">
        <h2 id="history-heading" class="history-title">Historial de Gastos</h2>
        <span id="history-counter" class="history-count">0 items</span>
      </div>

      <ul id="expense-list" class="expense-list" aria-live="polite">
      </ul>

      <!-- Estado Vacío -->
      <div id="empty-state" class="empty-state">
        <p class="empty-state-text">No hay gastos registrados todavía</p>
        <span class="empty-state-sub">Agrega tu primer gasto usando el formulario de arriba</span>
      </div>
    </section>
  </main>

  <!-- Módulos JavaScript -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
