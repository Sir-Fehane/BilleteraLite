<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0369a1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background for maskable compatibility -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <!-- Wallet Body -->
  <g filter="url(#shadow)">
    <!-- Back flap -->
    <rect x="96" y="150" width="320" height="212" rx="28" fill="#bae6fd" />
    
    <!-- Main Wallet Pocket -->
    <rect x="96" y="180" width="320" height="182" rx="24" fill="url(#walletGrad)" />
    
    <!-- Top folded card hint -->
    <rect x="136" y="140" width="100" height="40" rx="8" fill="#0284c7" opacity="0.8"/>
    <rect x="256" y="146" width="120" height="34" rx="8" fill="#38bdf8" opacity="0.8"/>

    <!-- Front Stitch / Seam detail -->
    <path d="M 104 220 L 408 220" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="6,6" fill="none" />

    <!-- Clasp / Fastener tab -->
    <path d="M 330 236 L 416 236 C 428 236 436 246 436 258 L 436 284 C 436 296 428 306 416 306 L 330 306 Z" fill="#0284c7" />
    
    <!-- Coin / Button on clasp -->
    <circle cx="396" cy="271" r="14" fill="#facc15" stroke="#eab308" stroke-width="2"/>
    <text x="396" y="277" font-size="16" font-family="Arial, sans-serif" font-weight="bold" fill="#78350f" text-anchor="middle">$</text>
  </g>
</svg>
